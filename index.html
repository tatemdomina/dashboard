<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1035">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Sky">
<meta name="robots" content="noindex,nofollow">
<title>My Sky</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231B1035'/%3E%3Cpath d='M40 10a23 23 0 1 0 14 34A19 19 0 0 1 40 10z' fill='%23F4C468'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,600&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1035; --bg2:#140B29; --card:#261848; --card2:#2F1F57; --line:rgba(168,150,240,.22);
  --text:#F3EEFF; --mute:#B9ADD9; --coral:#FF8A5B; --gold:#F4C468; --aqua:#7FD8D0; --lilac:#A896F0; --rose:#E893C4;
  --serif:'Fraunces',Georgia,'Times New Roman',serif; --sans:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif; --hand:'Caveat','Bradley Hand','Segoe Script',cursive;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.55;font-weight:300;
  background-image:radial-gradient(ellipse 90% 40% at 50% 0,rgba(168,150,240,.22),transparent 70%),radial-gradient(circle at 12% 18%,rgba(232,147,196,.10),transparent 30%),linear-gradient(var(--bg),var(--bg2));
  background-attachment:scroll;min-height:100vh}
main{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(60px + env(safe-area-inset-bottom))}
h1,h2,h3{font-family:var(--serif);font-style:italic;font-weight:600;margin:0;line-height:1.15}
h1{font-size:34px;letter-spacing:-.01em}
.rainbow{background:linear-gradient(90deg,var(--coral),var(--gold),var(--aqua),var(--lilac),var(--rose));-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
h2{font-size:23px}
h3{font-size:18px;font-weight:400}
p{margin:0 0 10px}
a{color:var(--aqua)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:rgba(255,255,255,.12)}
.mast{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:18px}
.mast .sub{color:var(--mute);font-size:13.5px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:20px 18px;margin:0 0 18px;box-shadow:0 10px 30px rgba(8,3,25,.35)}
.card>header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}
.mute{color:var(--mute)} .small{font-size:13px}
.c-coral{color:var(--coral)} .c-gold{color:var(--gold)} .c-aqua{color:var(--aqua)} .c-lilac{color:var(--lilac)} .c-rose{color:var(--rose)}
.btn{min-height:44px;padding:9px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card2);font-weight:400;font-size:14px}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--coral);border-color:var(--coral);color:#2a1206;font-weight:600}
.btn.ghost{background:transparent}
.btn.icon{width:44px;padding:0;font-size:19px;flex:none}
.btn.danger{border-color:var(--coral);color:var(--coral)}
.x{width:40px;height:40px;flex:none;border:0;background:transparent;color:var(--mute);font-size:20px;border-radius:50%}
.x:active{background:rgba(255,255,255,.1)}
/* banner */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.cell{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 13px;min-width:0}
.cell .big{font-family:var(--serif);font-style:italic;font-size:19px;line-height:1.2;margin:5px 0 4px}
.cell .small{line-height:1.4}
.glyph{font-family:'Apple Symbols','Segoe UI Symbol','Noto Sans Symbols','Noto Sans Symbols 2',sans-serif}
/* forms */
form.add{display:flex;gap:8px;margin-top:12px}
input[type=text],textarea{width:100%;min-width:0;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:11px 13px;font-size:16px;color:var(--text);font-weight:300}
input[type=text]:focus,textarea:focus{outline:2px solid var(--lilac);outline-offset:1px}
textarea{min-height:130px;resize:vertical;display:block}
::placeholder{color:#8f83b3}
ul.list{list-style:none;margin:0;padding:0}
ul.list li{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid rgba(168,150,240,.12)}
ul.list li:last-child{border-bottom:0}
ul.list .t{flex:1;min-width:0;overflow-wrap:anywhere}
ul.list .n{font-family:var(--serif);font-style:italic;color:var(--gold);font-size:20px;width:26px;flex:none}
label.chk{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:44px;cursor:pointer}
label.chk input{width:24px;height:24px;flex:none;accent-color:var(--aqua);margin:0}
label.chk span{overflow-wrap:anywhere;min-width:0}
label.chk input:checked+span{color:var(--mute);text-decoration:line-through}
.empty{color:var(--mute);font-size:13.5px;padding:6px 0}
/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:42px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg2);font-size:14px;font-weight:300}
.chip[aria-pressed=true]{background:var(--aqua);border-color:var(--aqua);color:#0d2b2a;font-weight:600}
.chip.spice[aria-pressed=true]{background:var(--gold);border-color:var(--gold);color:#33240a}
.val{padding:9px 16px;border-radius:999px;border:1px solid currentColor;font-family:var(--serif);font-style:italic;font-size:17px;background:rgba(255,255,255,.03)}
details{border-top:1px solid rgba(168,150,240,.14)}
details summary{min-height:48px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;list-style:none;font-weight:400}
details summary::-webkit-details-marker{display:none}
details summary::after{content:'+';font-size:22px;color:var(--mute);width:28px;text-align:center}
details[open] summary::after{content:'–'}
details .chips{padding:2px 0 14px}
.bar{height:12px;border-radius:99px;background:var(--bg2);overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--aqua),var(--gold));transition:width .3s}
.score{font-family:var(--serif);font-style:italic;font-size:30px}
/* horoscope */
.horo p{font-size:15.5px}
.keyt{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--gold);border:1px solid rgba(244,196,104,.5);border-radius:99px;padding:5px 12px;margin-bottom:12px}
.affirm{font-family:var(--hand);font-size:29px;line-height:1.15;color:var(--rose);margin:16px 0 14px;font-weight:500}
.crystal{display:flex;gap:11px;align-items:flex-start;padding:8px 0}
.crystal .dot{width:16px;height:16px;border-radius:5px;transform:rotate(45deg);flex:none;margin:5px 4px 0 3px;box-shadow:0 0 12px currentColor}
.crystal b{font-weight:600}
.word{font-family:var(--serif);font-style:italic;font-size:44px;line-height:1.1;color:var(--gold);margin:2px 0 12px;overflow-wrap:anywhere}
.asp{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(168,150,240,.12)}
.asp:last-child{border-bottom:0}
.asp .g{font-size:19px;width:66px;flex:none;letter-spacing:2px}
.asp .d{flex:1;min-width:0;font-size:14px}
.asp .o{font-size:12.5px;color:var(--mute);text-align:right;flex:none}
/* mood / water */
.moods{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.mood{aspect-ratio:1;min-height:42px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-size:22px;padding:0}
.mood[aria-pressed=true]{background:var(--lilac);border-color:var(--lilac);transform:scale(1.08)}
.glasses{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.glass{aspect-ratio:3/4;min-height:44px;border-radius:6px 6px 12px 12px;border:2px solid var(--aqua);background:transparent;padding:0;font-size:12px;color:var(--mute)}
.glass[aria-pressed=true]{background:var(--aqua);color:#0d2b2a;font-weight:600}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;min-height:44px;border-radius:14px;border:1px solid var(--line);background:var(--bg2);font-size:13.5px;padding:6px 4px}
.tab[aria-selected=true]{background:var(--lilac);border-color:var(--lilac);color:#1b1035;font-weight:600}
.star{background:var(--card2);border-radius:18px;padding:15px 14px;margin-top:12px}
.feed-src{padding:11px 0;border-bottom:1px solid rgba(168,150,240,.12)}
.feed-src:last-child{border-bottom:0}
.feed-src .name{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600;font-size:14px}
.feed-src .name a{font-weight:400;font-size:12.5px;white-space:nowrap}
a.item{display:block;padding:7px 0;color:var(--text);text-decoration:none;font-size:14.5px}
a.item span{display:block;color:var(--mute);font-size:12px}
a.item:active{color:var(--aqua)}
.game{padding:8px 0;font-size:14.5px}
table.natal{width:100%;border-collapse:collapse;font-size:14px}
table.natal td{padding:7px 4px;border-bottom:1px solid rgba(168,150,240,.12)}
table.natal td:last-child{text-align:right;color:var(--mute)}
.note{background:rgba(244,196,104,.1);border:1px solid rgba(244,196,104,.4);border-radius:14px;padding:11px 13px;font-size:13.5px;margin-bottom:16px}
.hide{display:none!important}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
footer{text-align:center;color:var(--mute);font-size:12px;margin-top:26px}
</style>
</head>
<body>
<main>
  <div class="mast">
    <div>
      <h1 class="rainbow" id="greet">Hello</h1>
      <div class="sub" id="dateline"></div>
    </div>
    <button class="btn icon" data-a="settings" aria-label="Settings" aria-expanded="false" id="setBtn">⚙</button>
  </div>
  <div class="note hide" id="storeWarn">Heads up: this browser is blocking saved data (private mode, or the page is embedded in a preview). Open the page directly in Safari or Chrome so your entries are kept.</div>

  <section class="card hide" id="settings"></section>
  <div class="grid" id="banner"></div>
  <section class="card horo" id="horo"></section>
  <section class="card" id="intent"></section>
  <section class="card" id="sky"></section>
  <section class="card" id="mood"></section>
  <section class="card" id="water"></section>
  <section class="card" id="plants"></section>
  <section class="card" id="habits"></section>
  <section class="card" id="tasks"></section>
  <section class="card" id="grat"></section>
  <section class="card" id="reflect">
    <header><h2>Evening reflection</h2><span class="small mute" id="reflSaved"></span></header>
    <textarea id="reflText" placeholder="What did today teach me? What am I releasing?" aria-label="Evening reflection"></textarea>
  </section>
  <section class="card" id="star"></section>
  <section class="card" id="values"></section>
  <section class="card" id="forme"></section>
  <section class="card" id="forus"></section>
  <section class="card" id="sunday"></section>
  <section class="card" id="natal"></section>
  <footer>Made with wonder ✦ everything you enter stays on this device</footer>
</main>

<script>
'use strict';
/* ============ helpers ============ */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function pad(n){ return n<10?'0'+n:''+n; }
function dkey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function weekStart(d){ var s=new Date(d.getFullYear(),d.getMonth(),d.getDate()); s.setDate(s.getDate()-s.getDay()); return s; }
function fmtDay(iso){ var d=new Date(iso); return isNaN(d)?'':d.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); }
var NOW = new Date(), TODAY = dkey(NOW), WEEK = dkey(weekStart(NOW));

/* ============ storage ============ */
var KEY='mysky-v1', FKEY='mysky-feed-v1', storageOK=true;
var DEF={ name:'', place:'Madison, WI', intention:'Wisdom', seed:0, tab:'today',
  plants:{week:WEEK,items:[]}, customPlants:[], days:{},
  habits:[{id:'h1',t:'Morning movement'},{id:'h2',t:'Meditate or breathe'},{id:'h3',t:'Time outside'},{id:'h4',t:'Read or learn something'},{id:'h5',t:'Screens off by 10'}],
  gratitude:[], tasks:{today:[],week:[],long:[]}, star:{prio:[],goals:[],dreams:[]}, opened:[] };
var S;
function load(){
  var o=null;
  try{ localStorage.setItem(KEY+'-t','1'); if(localStorage.getItem(KEY+'-t')!=='1') throw 0; localStorage.removeItem(KEY+'-t'); o=JSON.parse(localStorage.getItem(KEY)||'null'); }
  catch(e){ storageOK=false; }
  S=JSON.parse(JSON.stringify(DEF));
  if(o&&typeof o==='object'){ for(var k in o) S[k]=o[k]; }
  ['today','week','long'].forEach(function(k){ if(!Array.isArray(S.tasks[k])) S.tasks[k]=[]; });
  ['prio','goals','dreams'].forEach(function(k){ if(!Array.isArray(S.star[k])) S.star[k]=[]; });
  if(!Array.isArray(S.customPlants)) S.customPlants=[];
  if(!S.plants||S.plants.week!==WEEK) S.plants={week:WEEK,items:[]};   // weekly reset, Sunday to Sunday
  var cut=new Date(NOW); cut.setDate(cut.getDate()-45); var ck=dkey(cut);
  for(var d in S.days) if(d<ck) delete S.days[d];
  S.opened=(S.opened||[]).filter(function(x){return x.d>=ck;});
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){ storageOK=false; $('storeWarn').classList.remove('hide'); } }
function day(){ if(!S.days[TODAY]) S.days[TODAY]={mood:null,water:0,habits:{},reflection:''}; return S.days[TODAY]; }

/* ============ astronomy (low-precision ephemeris, after Paul Schlyter) ============ */
var R=Math.PI/180;
function n360(x){ x%=360; return x<0?x+360:x; }
function sn(x){return Math.sin(x*R);} function cs(x){return Math.cos(x*R);}
function kepler(M,e){ M=n360(M); var E=M+e/R*sn(M)*(1+e*cs(M)); for(var i=0;i<8;i++){ E=E-(E-e/R*sn(E)-M)/(1-e*cs(E)); } return E; }
var EL={ // N, i, w, a, e, M : [base, rate per day]
  Mercury:[[48.3313,3.24587e-5],[7.0047,5e-8],[29.1241,1.01444e-5],[0.387098,0],[0.205635,5.59e-10],[168.6562,4.0923344368]],
  Venus:[[76.6799,2.4659e-5],[3.3946,2.75e-8],[54.891,1.38374e-5],[0.72333,0],[0.006773,-1.302e-9],[48.0052,1.6021302244]],
  Mars:[[49.5574,2.11081e-5],[1.8497,-1.78e-8],[286.5016,2.92961e-5],[1.523688,0],[0.093405,2.516e-9],[18.6021,0.5240207766]],
  Jupiter:[[100.4542,2.76854e-5],[1.303,-1.557e-7],[273.8777,1.64505e-5],[5.20256,0],[0.048498,4.469e-9],[19.895,0.0830853001]],
  Saturn:[[113.6634,2.3898e-5],[2.4886,-1.081e-7],[339.3939,2.97661e-5],[9.55475,0],[0.055546,-9.499e-9],[316.967,0.0334442282]],
  Uranus:[[74.0005,1.3978e-5],[0.7733,1.9e-8],[96.6612,3.0565e-5],[19.18171,-1.55e-8],[0.047318,7.45e-9],[142.5905,0.011725806]],
  Neptune:[[131.7806,3.0173e-5],[1.77,-2.55e-7],[272.8461,-6.027e-6],[30.05826,3.313e-8],[0.008606,2.15e-9],[260.2471,0.005995147]]
};
function positions(date){
  var d=date.getTime()/86400000-10956, out={};
  // Sun
  var ws=282.9404+4.70935e-5*d, es=0.016709-1.151e-9*d, Ms=n360(356.047+0.9856002585*d);
  var E=kepler(Ms,es), xv=cs(E)-es, yv=Math.sqrt(1-es*es)*sn(E);
  var rs=Math.sqrt(xv*xv+yv*yv), ls=n360(Math.atan2(yv,xv)/R+ws);
  out.Sun=ls; var xs=rs*cs(ls), ys=rs*sn(ls);
  // Moon
  var Nm=125.1228-0.0529538083*d, wm=318.0634+0.1643573223*d, Mm=n360(115.3654+13.0649929509*d), em=0.0549, im=5.1454;
  E=kepler(Mm,em); xv=60.2666*(cs(E)-em); yv=60.2666*Math.sqrt(1-em*em)*sn(E);
  var v=Math.atan2(yv,xv)/R, r=Math.sqrt(xv*xv+yv*yv);
  var xh=r*(cs(Nm)*cs(v+wm)-sn(Nm)*sn(v+wm)*cs(im)), yh=r*(sn(Nm)*cs(v+wm)+cs(Nm)*sn(v+wm)*cs(im));
  var lm=Math.atan2(yh,xh)/R, Ls=Ms+ws, Lm=Mm+wm+Nm, D=Lm-Ls, F=Lm-Nm;
  lm+= -1.274*sn(Mm-2*D)+0.658*sn(2*D)-0.186*sn(Ms)-0.059*sn(2*Mm-2*D)-0.057*sn(Mm-2*D+Ms)+0.053*sn(Mm+2*D)
       +0.046*sn(2*D-Ms)+0.041*sn(Mm-Ms)-0.035*sn(D)-0.031*sn(Mm+Ms)-0.015*sn(2*F-2*D)+0.011*sn(Mm-4*D);
  out.Moon=n360(lm);
  // planets
  var Mj=n360(19.895+0.0830853001*d), Msa=n360(316.967+0.0334442282*d), Mu=n360(142.5905+0.011725806*d);
  for(var p in EL){
    var q=EL[p].map(function(a){return a[0]+a[1]*d;}), N=q[0], i=q[1], w=q[2], a=q[3], e=q[4], M=q[5];
    E=kepler(M,e); xv=a*(cs(E)-e); yv=a*Math.sqrt(1-e*e)*sn(E); v=Math.atan2(yv,xv)/R; r=Math.sqrt(xv*xv+yv*yv);
    xh=r*(cs(N)*cs(v+w)-sn(N)*sn(v+w)*cs(i)); yh=r*(sn(N)*cs(v+w)+cs(N)*sn(v+w)*cs(i));
    var zh=r*sn(v+w)*sn(i), lon=Math.atan2(yh,xh)/R, lat=Math.atan2(zh,Math.sqrt(xh*xh+yh*yh))/R, pert=0;
    if(p==='Jupiter') pert=-0.332*sn(2*Mj-5*Msa-67.6)-0.056*sn(2*Mj-2*Msa+21)+0.042*sn(3*Mj-5*Msa+21)-0.036*sn(Mj-2*Msa)+0.022*cs(Mj-Msa)+0.023*sn(2*Mj-3*Msa+52)-0.016*sn(Mj-5*Msa-69);
    if(p==='Saturn') pert=0.812*sn(2*Mj-5*Msa-67.6)-0.229*cs(2*Mj-4*Msa-2)+0.119*sn(Mj-2*Msa-3)+0.046*sn(2*Mj-6*Msa-69)+0.014*sn(Mj-3*Msa+32);
    if(p==='Uranus') pert=0.04*sn(Msa-2*Mu+6)+0.035*sn(Msa-3*Mu+33)-0.015*sn(Mj-Mu+20);
    if(pert){ lon+=pert; xh=r*cs(lon)*cs(lat); yh=r*sn(lon)*cs(lat); }
    out[p]=n360(Math.atan2(yh+ys,xh+xs)/R);
  }
  // Pluto
  var Sp=50.03+0.033459652*d, P=238.95+0.003968789*d;
  var lp=238.9508+0.00400703*d-19.799*sn(P)+19.848*cs(P)+0.897*sn(2*P)-4.956*cs(2*P)+0.61*sn(3*P)+1.211*cs(3*P)-0.341*sn(4*P)-0.19*cs(4*P)+0.128*sn(5*P)-0.034*cs(5*P)-0.038*sn(6*P)+0.031*cs(6*P)+0.02*sn(Sp-P)-0.01*cs(Sp-P);
  var bp=-3.9082-5.453*sn(P)-14.975*cs(P)+3.527*sn(2*P)+1.673*cs(2*P)-1.051*sn(3*P)+0.328*cs(3*P)+0.179*sn(4*P)-0.292*cs(4*P)+0.019*sn(5*P)+0.1*cs(5*P)-0.031*sn(6*P)-0.026*cs(6*P)+0.011*cs(Sp-P);
  var rp=40.72+6.68*sn(P)+6.9*cs(P)-1.18*sn(2*P)-0.03*cs(2*P)+0.15*sn(3*P)-0.14*cs(3*P);
  out.Pluto=n360(Math.atan2(rp*sn(lp)*cs(bp)+ys, rp*cs(lp)*cs(bp)+xs)/R);

  var starter = landed.length ? 'Tell Matt about “'+landed[landed.length-1].t+'” — what about it landed for you, and what does it stir up for him?' : STARTERS[wkNo%STARTERS.length];
  $('sunday').innerHTML='<header><h2>Sunday summary</h2><span class="small mute">'+(NOW.getDay()===0?'today ✦':'week so far')+'</span></header>'+
    '<p class="small mute">Week of '+fmtDay(WEEK+'T12:00:00')+' · '+(Math.round(plantScore()*100)/100)+' plant pts · '+hab+' habits · '+water+' glasses · '+gr+' gratitudes'+(moods.length?' · '+moods.join(''):'')+'</p>'+
    '<div class="eyebrow">What I opened</div><ul class="list">'+(wk.map(function(x){
      return '<li><span class="t">'+esc(x.t)+'<br><span class="small mute">'+esc(x.src)+'</span></span><button class="chip" style="flex:none" data-a="landed" data-id="'+x.id+'" aria-pressed="'+(!!x.landed)+'">'+(x.landed?'♥ landed':'♡ landed?')+'</button></li>';
    }).join('')||'<li class="empty">Links you open from For Me and For Us will collect here.</li>')+'</ul>'+
    '<div class="eyebrow" style="margin-top:14px">What landed</div>'+(landed.length?'<p style="margin-top:6px">'+landed.map(function(x){return esc(x.t);}).join(' · ')+'</p>':'<div class="empty">Tap “landed?” on anything that stayed with you.</div>')+
    '<div class="star"><div class="eyebrow c-rose">Conversation starter for us</div><p style="margin:6px 0 0">'+esc(starter)+'</p></div>';
}

/* ============ natal reference ============ */
function renderNatal(){
  var rows=[['Sun','Sagittarius 17°37′'],['Moon','Aries 25°25′'],['Asc','Cancer 28°57′'],['MC','Aries 11°43′'],['Mercury','Sagittarius 8°11′ ℞'],['Venus','Scorpio 9°48′'],['Mars','Sagittarius 27°58′'],['Jupiter','Leo 8°43′ ℞'],['Saturn','Virgo 13°44′'],['Uranus','Scorpio 18°34′'],['Neptune','Sagittarius 18°01′'],['Pluto','Libra 18°41′'],['Node','Virgo 22°57′']];
  $('natal').innerHTML='<details style="border:0"><summary><h2>Full natal chart</h2></summary>'+
    '<p class="small mute">December 9, 1978 · 7:27 PM · Madison, WI</p>'+
    '<table class="natal">'+rows.map(function(r){return '<tr><td><span class="glyph c-gold">'+PG[r[0]]+'</span>&nbsp; '+NNAME[r[0]]+'</td><td>'+r[1]+'</td></tr>';}).join('')+'</table>'+
    '<div class="eyebrow" style="margin-top:16px">Tightest natal aspects</div><table class="natal"><tr><td>Sun conjunct Neptune</td><td>0.4°</td></tr><tr><td>Mercury trine Jupiter</td><td>0.5°</td></tr><tr><td>Moon trine Mars</td><td>2.6°</td></tr></table>'+
    '<div class="eyebrow" style="margin-top:16px">Matt · Sept 30, 1980 · 7:32 PM · Stoughton, WI</div><table class="natal"><tr><td>Sun</td><td>Libra</td></tr><tr><td>Moon</td><td>Cancer</td></tr><tr><td>Rising</td><td>Taurus</td></tr><tr><td>Standout aspect</td><td>Sun square Moon</td></tr></table>'+
    '<div class="eyebrow" style="margin-top:16px">Synastry</div><table class="natal"><tr><td>His Venus trine my Moon</td><td>near-exact ✦</td></tr><tr><td>His Sun sextile my Mercury</td><td></td></tr><tr><td>His Venus trine my Mars</td><td></td></tr></table>'+
    '<p class="small mute" style="margin-top:12px">Daily positions are computed on your phone with a compact ephemeris (accurate to within a few arcminutes for most bodies).</p></details>';
}

/* ============ settings ============ */
var resetArmed=false, setMsg='';
function renderSettings(){
  $('settings').innerHTML='<header><h2>Settings</h2><button class="btn" data-a="settings">Close</button></header>'+
    '<p class="small '+(storageOK?'c-aqua':'c-coral')+'">'+(storageOK?'✓ Saving works on this device.':'✗ This browser is blocking saved data.')+'</p>'+
    '<div class="eyebrow">My name (for the greeting)</div><form class="add" data-f="name" style="margin:6px 0 16px"><input type="text" name="t" maxlength="24" value="'+esc(S.name)+'" placeholder="Your name" autocomplete="off" aria-label="Name"><button class="btn primary" type="submit">Save</button></form>'+
    '<div class="eyebrow">Backup</div><p class="small mute" style="margin-top:6px">Copy this text somewhere safe. To restore, paste it below and tap Restore.</p>'+
    '<textarea id="backup" style="min-height:90px;font-size:12px" aria-label="Backup data"></textarea>'+
    '<div class="row" style="margin-top:10px"><button class="btn" data-a="bk-make">Show my data</button><button class="btn" data-a="bk-copy">Copy</button><button class="btn" data-a="bk-restore">Restore</button><button class="btn danger" data-a="reset">'+(resetArmed?'Tap again to erase everything':'Erase all data')+'</button></div>'+
    '<p class="small c-gold" id="setMsg" style="margin:10px 0 0">'+esc(setMsg)+'</p>';
}

/* ============ events ============ */
function addTo(list,text,extra){ var o={id:uid(),t:text}; if(extra) for(var k in extra) o[k]=extra[k]; list.push(o); return o; }
function removeId(list,id){ for(var i=0;i<list.length;i++) if(list[i].id===id){ list.splice(i,1); return; } }
document.addEventListener('submit',function(e){
  var f=e.target; if(!f.getAttribute||!f.getAttribute('data-f')) return;
  e.preventDefault();
  var inp=f.elements.t, v=(inp.value||'').trim(), kind=f.getAttribute('data-f');
  if(kind==='name'){ S.name=v; save(); renderMast(); setMsg='Saved.'; renderSettings(); return; }
  if(!v) { inp.focus(); return; }
  if(kind==='plant'){ addPlant(v,1); return; }
  if(kind==='task'){ addTo(S.tasks[S.tab],v,{done:false}); save(); renderTasks(); refocus('tasks'); }
  else if(kind==='grat'){ S.gratitude.unshift({id:uid(),t:v,d:TODAY}); save(); renderGrat(); renderSunday(); refocus('grat'); }
  else if(kind==='habit'){ addTo(S.habits,v); save(); renderHabits(); refocus('habits'); }
  else if(kind==='star'){ addTo(S.star[f.getAttribute('data-k')],v); save(); renderStar(); }
  else if(kind==='intent'){ S.intention=v.charAt(0).toUpperCase()+v.slice(1); intentOpen=false; save(); renderIntent(); }
});
function refocus(sec){ var i=$(sec).querySelector('form.add input'); if(i){ try{ i.focus({preventScroll:true}); }catch(e){ i.focus(); } } }
document.addEventListener('change',function(e){
  var t=e.target, c=t.getAttribute&&t.getAttribute('data-c'); if(!c) return;
  var id=t.getAttribute('data-id');
  if(c==='habit'){ day().habits[id]=t.checked; save(); renderHabits(); renderSunday(); }
  if(c==='task'){ (S.tasks[S.tab]||[]).forEach(function(x){ if(x.id===id) x.done=t.checked; }); save(); renderTasks(); }
});
document.addEventListener('click',function(e){
  var el=e.target.closest?e.target.closest('[data-a],[data-track]'):null; if(!el) return;
  if(el.hasAttribute('data-track')){
    var title=el.getAttribute('data-title'), last=S.opened[S.opened.length-1];
    if(!(last&&last.t===title&&last.d===TODAY)){ S.opened.push({id:uid(),t:title,src:el.getAttribute('data-src'),u:el.href,d:TODAY,landed:false}); save(); setTimeout(renderSunday,50); }
    return; // let the link open normally
  }
  var a=el.getAttribute('data-a'), v=el.getAttribute('data-v'), id=el.getAttribute('data-id'), d=day();
  switch(a){
    case 'settings': var p=$('settings'), open=p.classList.contains('hide'); resetArmed=false; setMsg=''; if(open) renderSettings(); p.classList.toggle('hide',!open); $('setBtn').setAttribute('aria-expanded',open); if(open) p.scrollIntoView({block:'start'}); break;
    case 'regen': S.seed=(S.seed||0)+1; save(); renderHoro(); break;
    case 'intent-toggle': intentOpen=!intentOpen; renderIntent(); break;
    case 'intent-set': S.intention=v; intentOpen=false; save(); renderIntent(); break;
    case 'mood': var i=+el.getAttribute('data-i'); d.mood=(d.mood===i?null:i); save(); renderMood(); renderSunday(); break;
    case 'water': var n=+el.getAttribute('data-i')+1; d.water=(d.water===n?n-1:n); save(); renderWater(); renderSunday(); break;
    case 'plant': var ix=S.plants.items.indexOf(v); if(ix<0) S.plants.items.push(v); else S.plants.items.splice(ix,1); el.setAttribute('aria-pressed',ix<0); save(); renderPlantTop(); renderSunday(); break;
    case 'plant-add': var pi=$('plants').querySelector('form[data-f=plant] input'); if(!addPlant(pi.value,+v)) pi.focus(); break;
    case 'plant-manage': plantManage=!plantManage; renderPlants(); break;
    case 'plant-remove': S.customPlants=S.customPlants.filter(function(x){return x.n!==v;}); S.plants.items=S.plants.items.filter(function(x){return x!==v;}); if(!S.customPlants.length) plantManage=false; save(); renderPlants(); renderSunday(); break;
    case 'habit-edit': habitEdit=!habitEdit; renderHabits(); break;
    case 'habit-del': removeId(S.habits,id); save(); renderHabits(); break;
    case 'tab': S.tab=v; save(); renderTasks(); break;
    case 'task-del': removeId(S.tasks[S.tab],id); save(); renderTasks(); break;
    case 'grat-del': removeId(S.gratitude,id); save(); renderGrat(); renderSunday(); break;
    case 'star-del': removeId(S.star[el.getAttribute('data-k')],id); save(); renderStar(); break;
    case 'landed': S.opened.forEach(function(x){ if(x.id===id) x.landed=!x.landed; }); save(); renderSunday(); break;
    case 'feed-refresh': loadFeeds(true); loadSports().then(renderForUs); break;
    case 'bk-make': $('backup').value=JSON.stringify(S); $('setMsg').textContent='Your data is in the box above.'; break;
    case 'bk-copy': var b=$('backup'); if(!b.value) b.value=JSON.stringify(S); b.focus(); b.select(); try{ b.setSelectionRange(0,b.value.length); }catch(x){}
      var ok=false; try{ ok=document.execCommand('copy'); }catch(x){} if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(b.value).catch(function(){}); ok=true; }
      $('setMsg').textContent=ok?'Copied.':'Select the text above and copy it.'; break;
    case 'bk-restore': try{ var o=JSON.parse($('backup').value); if(!o||typeof o!=='object'||!o.tasks) throw 0; localStorage.setItem(KEY,JSON.stringify(o)); load(); renderAll(); setMsg='Restored.'; }catch(x){ setMsg='That doesn\'t look like a backup — paste the full text and try again.'; } renderSettings(); break;
    case 'reset': if(!resetArmed){ resetArmed=true; renderSettings(); } else { try{ localStorage.removeItem(KEY); localStorage.removeItem(FKEY); }catch(x){} resetArmed=false; load(); renderAll(); setMsg='Everything was erased.'; renderSettings(); } break;
  }
});
var reflTimer;
$('reflText').addEventListener('input',function(){
  day().reflection=this.value; $('reflSaved').textContent='…';
  clearTimeout(reflTimer); reflTimer=setTimeout(function(){ save(); $('reflSaved').textContent=storageOK?'saved ✓':'not saved'; },400);
});
$('reflText').addEventListener('blur',function(){ day().reflection=this.value; save(); });

/* ============ boot ============ */
function renderAll(){
  renderMast(); renderBanner(); renderHoro(); renderIntent(); renderSky(); renderMood(); renderWater(); renderPlants(); renderHabits(); renderTasks(); renderGrat(); renderStar(); renderValues(); renderForMe(); renderForUs(); renderSunday(); renderNatal();
  $('reflText').value=day().reflection||'';
}
function boot(){
  NOW=new Date(); TODAY=dkey(NOW); WEEK=dkey(weekStart(NOW));
  load(); computeSky(); renderAll();
  if(!storageOK) $('storeWarn').classList.remove('hide');
  loadWeather(); loadFeeds(false); loadSports().then(renderForUs);
}
boot();
// refresh when the tab comes back on a new day (or after an hour away)
var bootAt=Date.now();
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState==='visible' && (dkey(new Date())!==TODAY || Date.now()-bootAt>3600000)){
    if(document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName)) return;
    bootAt=Date.now(); boot();
  }
});
</script>
